# /etc/nginx/sites-available/moneybot
# 1 核 1G 的机器，Nginx 只是反代 + 缓存 + TLS，别上 Apache。
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 静态资源走 Nginx，不经过 Python
    root /opt/moneybot/site;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/json application/xml text/plain image/svg+xml;
    gzip_min_length 512;

    location /paid/ {
        add_header X-Robots-Tag "noindex";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 动态：广告位跳转 / 订阅 / 统计 / 付费 token
    location ~ ^/(go|p|api)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/moneybot.access.log;
    error_log  /var/log/nginx/moneybot.error.log warn;
}
